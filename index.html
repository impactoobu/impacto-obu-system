<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>IMPACTO OBU SYSTEM</title></head><body>
<div id="toast" hidden></div>
<section id="auth" class="auth"><div class="card"><div class="logo">極</div><h1>IMPACTO OBU</h1><p>Sistema de gestão</p><form id="login"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" minlength="6" required><button>Entrar</button></form><button id="showRegister" class="ghost">Criar primeiro administrador</button><form id="register" hidden><input id="name" placeholder="Nome" value="Igor Urata" required><input id="regEmail" type="email" placeholder="E-mail" required><input id="regPassword" type="password" placeholder="Senha" minlength="6" required><button>Criar conta</button></form></div></section>
<div id="app" hidden><header><div><b>IMPACTO OBU</b><small id="user"></small></div><button id="logout">Sair</button></header><main>
<section id="home" class="page active"><h1>Dashboard</h1><div class="metrics"><article><span>Alunos ativos</span><b id="mStudents">0</b></article><article><span>Presentes hoje</span><b id="mAttendance">0</b></article><article><span>Recebido</span><b id="mReceived">¥0</b></article><article><span>Pendente</span><b id="mPending">¥0</b></article></div></section>
<section id="students" class="page"><div class="title"><h1>Alunos</h1><button id="newStudent">+ Novo</button></div><input id="search" placeholder="Buscar aluno"><div id="studentList"></div></section>
<section id="attendance" class="page"><h1>Presença</h1><div class="panel"><div id="reader"></div><button id="startScan">Abrir câmera</button><button id="stopScan" hidden>Fechar câmera</button></div><div class="panel"><input id="manualCode" placeholder="Ex.: OBU-1001"><button id="manualBtn">Confirmar check-in</button></div><div id="attendanceList"></div></section>
<section id="finance" class="page"><h1>Financeiro</h1><div id="financeList"></div></section>
</main><nav><button data-page="home" class="active">⌂<span>Início</span></button><button data-page="students">♟<span>Alunos</span></button><button data-page="attendance">▣<span>QR</span></button><button data-page="finance">¥<span>Financeiro</span></button></nav></div>
<dialog id="studentDialog"><form id="studentForm"><div class="title"><h2>Novo aluno</h2><button type="button" id="closeDialog">✕</button></div><input id="studentName" placeholder="Nome completo" required><select id="category"><option>Baby</option><option selected>Kids</option><option>Teen</option><option>Adult</option></select><select id="belt"><option>Branca</option><option>Azul</option><option>Roxa</option><option>Marrom</option><option>Preta</option></select><input id="fee" type="number" value="8800" placeholder="Mensalidade" required><input id="responsible" placeholder="Responsável"><input id="phone" placeholder="Telefone"><button>Salvar</button></form></dialog>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script type="module" src="app.js"></script></body></html>
